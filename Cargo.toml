[workspace]
resolver = "2"
members = [
  ## Read and parse files with fancy error with miette
  "pipelight_error",
  ## Small utils crate
  "pipelight_config",
  "pipelight_utils",
  ## Process management
  "pipelight_exec",
  "pipelight_git",
  "pipelight_teleport",
  ## Watchexec sane and reusable configuration.
  "pipelight_watcher",
  ## A templating crate for default pipelight configuration generation
  "templates",

  ## Read multiple file formats and casts them to pipelight config
  "cast",
  ## Core crates with interdependencies
  "workflow",
  "cli",
  ## Bin package and Lib entrypoint
  "pipelight",
  "man",

  # Wasm
  "deno_lib",
]

[workspace.dependencies]

# getrandom = { version = "0.2.15", features = ["wasm-bindgen"] }
thiserror = "2.0.12"
miette = "7.2.0"
bon = "3.6.3"

# Log/Tracing
log = "0.4.22"
env_logger = "0.11.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["ansi", "env-filter"] }
tracing-log = "0.2.0"
tracing-test = "0.2.6"
derivative = "2.2.0"

gix = { version = "0.85.0", features = ["dirwalk"] }
gix-dir = "0.27.0"

toml = { version = "0.9.5", features = ["parse", "preserve_order"] }
hcl-rs = "0.19.2"
serde_yaml = "0.9.34"
serde_json = "1.0.125"
serde = { version = "1.0.210", features = ["derive"] }

pretty_assertions = "1.4.1"
serial_test = "3.2.0"
itertools = "0.14.0"

uuid = "1.10.0"
once_cell = "1.19.0"
convert_case = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
lto = true
